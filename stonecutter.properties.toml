# Trade Cycling versions are Fabric files from Modrinth. 1.21.11 tracks the current 1.0.23 release.
# 1.21 reuses the 1.21.1 Trade Cycling jar. 1.21.2 has no Trade Cycling build.
# 1.20.6 is the last release that still stores trades in data components and runs on Java 21.
# 1.20.4 and older store trades in NBT. 1.20.2 uses the same listing field shapes as 1.20.4.
# 1.19 through 1.20.1 use the older shapes: item counts, a single stew effect, and every tradeable enchantment.
# 1.19, 1.19.1, and 1.19.2 use Registry and the Button constructor. 1.19.3 adds BuiltInRegistries and Button.builder.

